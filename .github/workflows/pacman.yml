name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch: 

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Halloween Pac-Man contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: IKM-Products
          outputs: |
            dist/pacman-contribution-graph.svg?palette=github-dark&color_snake=#f97316&color_dots=#161b22,#631c03,#bd4002,#f97316,#fef08a
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&color_snake=#f97316&color_dots=#161b22,#631c03,#bd4002,#f97316,#fef08a

      - name: Publish SVG files to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
