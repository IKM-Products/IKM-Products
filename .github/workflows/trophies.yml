name: Generate GitHub Trophies

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy image
        uses: soulteary/github-profile-trophy-action@main
        with:
          username: IKM-Products
          theme: algolia
          output: github-trophies.svg

      - name: Commit generated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-trophies.svg
          git diff --cached --quiet || git commit -m "Update GitHub trophies"
          git push
